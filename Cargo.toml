[package]
name = "claude-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust runtime for Claude Code agent sessions"
license = "MIT"
repository = "https://github.com/borg-ml/claude-agents"
homepage = "https://github.com/borg-ml/claude-agents"
readme = "README.md"
keywords = ["claude", "agents", "anthropic", "sdk"]
categories = ["api-bindings", "asynchronous"]
authors = ["Borg contributors"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4"] }

[lints.rust]
unsafe_code = "deny"
